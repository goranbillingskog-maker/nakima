name: Validate sitemap

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate sitemap lastmod values
        run: bun run test:sitemap
